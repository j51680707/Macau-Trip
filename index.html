        // --- Helper: WGS84 to GCJ02 Converter (For Amap Alignment) ---
        const wgs2gcj = (lat, lng) => {
            const PI = 3.14159265358979324;
            const a = 6378245.0;
            const ee = 0.00669342162296594323;

            if (outOfChina(lat, lng)) {
                return [lat, lng];
            }

            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLon(lng - 105.0, lat - 35.0);
            const radLat = lat / 180.0 * PI;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * PI);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * PI);
            const mgLat = lat + dLat;
            const mgLng = lng + dLng;
            return [mgLat, mgLng];
        };

        const transformLat = (x, y) => {
            let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
            return ret;
        };

        const transformLon = (x, y) => {
            let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
            return ret;
        };

        const outOfChina = (lat, lon) => {
            if (lon < 72.004 || lon > 137.8347) return true;
            if (lat < 0.8293 || lat > 55.8271) return true;
            return false;

        // --- Amap (Using Leaflet) Component ---
        const AmapLeafletTab = ({ points }) => {
            const [activePoint, setActivePoint] = useState(points[0]);
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markersRef = useRef({});

            useEffect(() => {
                if (!mapRef.current) return;

                // 1. Initialize Map
                const initialCenter = wgs2gcj(activePoint.coords[0], activePoint.coords[1]);
                const map = L.map(mapRef.current, {
                    center: initialCenter,
                    zoom: 15,
                    zoomControl: false,
                    attributionControl: false 
                });
                
                mapInstanceRef.current = map;

                // 2. Add Amap Tile Layer
                L.tileLayer('https://wprd04.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
                    maxZoom: 18,
                    minZoom: 3,
                    attribution: '© 高德地圖 (Amap)'
                }).addTo(map);

                // 3. Add Markers
                points.forEach(p => {
                    const amapCoords = wgs2gcj(p.coords[0], p.coords[1]);
                    
                    const icon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="marker-pin ${p.id === activePoint.id ? 'is-active' : ''}"></div>
                               <div class="marker-text ${p.id === activePoint.id ? 'is-active' : ''}">${p.number}</div>`,
                        iconSize: [30, 42],
                        iconAnchor: [15, 42]
                    });

                    const marker = L.marker(amapCoords, { icon }).addTo(map);
                    marker.bindPopup(`<b>${p.title}</b><br>${p.location}`);
                    
                    marker.on('click', () => {
                        setActivePoint(p);
                    });

                    markersRef.current[p.id] = marker;
                });

                return () => {
                    map.remove();
                    mapInstanceRef.current = null;
                };
            }, []);

            // Effect: Handle active point change
            useEffect(() => {
                if (!mapInstanceRef.current) return;
                
                const amapCoords = wgs2gcj(activePoint.coords[0], activePoint.coords[1]);
                mapInstanceRef.current.setView(amapCoords, 16);

                Object.entries(markersRef.current).forEach(([id, marker]) => {
                    const isActive = id === activePoint.id;
                    const icon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="marker-pin ${isActive ? 'is-active' : ''}"></div>
                               <div class="marker-text ${isActive ? 'is-active' : ''}">${points.find(p => p.id === id).number}</div>`,
                        iconSize: [30, 42],
                        iconAnchor: [15, 42]
                    });
                    marker.setIcon(icon);
                    if(isActive) marker.openPopup();
                });

            }, [activePoint]);

            return (

                    <div className="h-1/2 w-full relative shadow-md z-10">
                        <div ref={mapRef} className="w-full h-full z-0" />
                        
                        <div className="absolute bottom-2 left-2 z-[400] bg-white/90 px-3 py-1 text-xs font-bold rounded-full shadow text-emerald-700 border border-emerald-100 flex items-center gap-1 backdrop-blur-sm">

                    setIsHeaderExpanded(true);
                }
            }, [view]);
            
            // Weather State
            const [weather, setWeather] = useState({ temp: 22, code: 0, isForecast: false, desc: '載入中...' });

            // Fetch Weather Logic
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const targetDateStr = ITINERARY_DATES[currentDay];
                        const targetDate = new Date(targetDateStr);
                        const now = new Date();
                        
                        const diffTime = targetDate - now;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        const isForecastable = diffDays >= 0 && diffDays <= 14;

                        let url = '';
                        let isForecastMode = false;

                        if (isForecastable) {
                            url = `https://api.open-meteo.com/v1/forecast?latitude=22.19&longitude=113.54&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai&start_date=${targetDateStr}&end_date=${targetDateStr}`;
                            isForecastMode = true;
                        } else {
                            url = 'https://api.open-meteo.com/v1/forecast?latitude=22.19&longitude=113.54&current=temperature_2m,weather_code&timezone=Asia%2FShanghai';
                            isForecastMode = false;
                        }

                        const res = await fetch(url);
                        const data = await res.json();

                        if (isForecastMode && data.daily) {
                            const maxTemp = Math.round(data.daily.temperature_2m_max[0]);
                            const code = data.daily.weather_code[0];
                            setWeather({
                                temp: maxTemp,
                                code: code,
                                isForecast: true,
                                desc: getWeatherDesc(code)
                            });
                        } else if (data.current) {
                            setWeather({
                                temp: Math.round(data.current.temperature_2m),
                                code: data.current.weather_code,
                                isForecast: false,
                                desc: getWeatherDesc(data.current.weather_code)
                            });
                        }
                    } catch (e) {
                        console.error("Weather fetch failed", e);
                        setWeather({ temp: 20, code: 1, isForecast: false, desc: '舒適' });
                    }
                };
                
                fetchWeather();
            }, [currentDay]);

            const getWeatherIcon = (code) => {
                if (code <= 1) return <Sun className="w-5 h-5 text-yellow-400" />;
                if (code <= 3) return <Cloud className="w-5 h-5 text-gray-200" />;
                if (code <= 48) return <Wind className="w-5 h-5 text-blue-200" />;
                if (code <= 67) return <CloudRain className="w-5 h-5 text-blue-400" />;
                if (code >= 95) return <CloudLightning className="w-5 h-5 text-purple-400" />;
                return <Cloud className="w-5 h-5 text-gray-200" />;
            };

            const getWeatherDesc = (code) => {
                if (code <= 1) return '晴朗';
                if (code <= 3) return '多雲';
                if (code <= 48) return '起霧';
                if (code <= 67) return '有雨';

            const currentDateStr = useMemo(() => {
                const dates = { 1: '12/13 (六)', 2: '12/14 (日)', 3: '12/15 (一)' };

                                    e.target.onerror = null; 
                                    e.target.src="https://placehold.co/800x600/064e3b/10b981.png?text=Macau+View";
                                }}
                                alt="Header Background" 
                                className="w-full h-full object-cover opacity-90" 
                             />
                             {/* Warm Light Gradient Overlay for Golden Macau feel */}
                             <div className="absolute inset-0 bg-gradient-to-b from-amber-100/30 via-amber-50/80 to-white/95" />
                        </div>

                        {/* Content Layer */}
                        <div className={`relative z-10 text-amber-950 ${isHeaderExpanded ? 'p-6 pt-10' : 'p-2 pt-8 pb-3'}`}>
                            
                            {/* Toggle Button */}
                            <button 
                                onClick={() => setIsHeaderExpanded(!isHeaderExpanded)}
                                className="absolute bottom-[-12px] left-1/2 transform -translate-x-1/2 bg-amber-900 text-white rounded-full p-1 shadow-md border border-amber-800 z-20 hover:scale-110 transition-transform"
                            >
                                {isHeaderExpanded ? <ChevronUp className="w-4 h-4" /> : <ChevronDown className="w-4 h-4" />}
                            </button>

                            {isHeaderExpanded ? (
                                <>
                                    <div className="flex justify-between items-start mb-4 animate-in fade-in zoom-in duration-300">
                                        <div>
                                            <h1 className="text-2xl font-bold tracking-tight drop-shadow-sm text-amber-950">澳門奢華慢活之旅</h1>
                                            <div className="flex items-center gap-2 mt-1 opacity-90 text-sm font-medium text-amber-900">
                                                <MapPin className="w-4 h-4" />
                                                <span>Macau, China</span>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setShowTips(true)}
                                            className="bg-white/60 p-2 rounded-full hover:bg-white/80 text-amber-800 transition shadow-sm backdrop-blur-sm border border-amber-200/50"
                                        >
                                            <Info className="w-5 h-5" />
                                        </button>
                                    </div>
                                    
                                    <div className="flex items-end justify-between animate-in slide-in-from-top-2 duration-300">
                                        <div>
                                            <p className="text-amber-800 text-sm font-bold uppercase tracking-wider">Day {currentDay}</p>
                                            <p className="text-3xl font-bold text-amber-950">{currentDateStr}</p>
                                        </div>
                                        {/* Enhanced Weather Widget */}
                                        <div className="flex flex-col items-end">
                                            <div className="flex items-center gap-2 bg-white/60 px-3 py-1.5 rounded-lg backdrop-blur-md shadow-sm border border-white/40 relative overflow-hidden group">
                                                <div className={`absolute top-0 right-0 px-1 py-[1px] text-[8px] font-bold uppercase rounded-bl shadow-sm
                                                    ${weather.isForecast ? 'bg-orange-500 text-white' : 'bg-blue-500 text-white'}`}>
                                                    {weather.isForecast ? '預報' : '即時'}
                                                </div>
                                                
                                                <div className="flex items-center gap-2 mt-1">
                                                    {getWeatherIcon(weather.code)}
                                                    <div className="flex flex-col items-end">
                                                        <span className="text-2xl font-bold leading-none text-amber-900">{weather.temp}°C</span>
                                                        <span className="text-[10px] opacity-80 font-bold text-amber-800">{weather.desc}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            ) : (
                                /* Collapsed State - Minimal Header */
                                <div className="flex justify-between items-center px-2 animate-in fade-in duration-300">
                                     <h1 className="text-sm font-bold flex items-center gap-2 text-amber-950">
                                        <MapPin className="w-3 h-3 text-amber-700" />
                                        澳門之旅 <span className="opacity-75 font-normal text-xs">| Day {currentDay}</span>
                                     </h1>
                                     
                                     <div className="flex items-center gap-2">
                                         <div className="flex items-center gap-1 bg-white/60 px-2 py-0.5 rounded text-xs backdrop-blur-md border border-white/40 text-amber-900 font-bold">
                                            {getWeatherIcon(weather.code)}
                                            <span>{weather.temp}°</span>
                                         </div>
                                         <button 
                                            onClick={() => setShowTips(true)}
                                            className="bg-white/60 p-1 rounded-full hover:bg-white/80 text-amber-800 transition shadow-sm backdrop-blur-sm"
                                        >
                                            <Info className="w-3 h-3" />
                                        </button>
                                     </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* --- Main Content Area --- */}
                    <div className="flex-1 overflow-y-auto overflow-x-hidden relative scroll-smooth bg-gray-50">
                        
                        {view === 'timeline' && (
                            <div className="p-4 pb-24 space-y-6">
                                {itineraryData[currentDay].map((item, index) => {
                                    const Icon = IconMap[item.type] || MapPin;
                                    const isLast = index === itineraryData[currentDay].length - 1;
                                    
                                    return (
                                        <div key={item.id} className="relative flex gap-4">
                                            {/* Timeline Line */}
                                            {!isLast && (
                                                <div className="absolute left-[27px] top-10 bottom-[-24px] w-0.5 bg-gray-200" />
                                            )}
                                            
                                            {/* Left: Time & Icon */}
                                            <div className="flex flex-col items-center min-w-[56px]">
                                                <span className="text-xs font-bold text-gray-500 mb-1">{item.time}</span>
                                                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center shadow-md z-10 
                                                    ${item.type === 'food' ? 'bg-orange-100 text-orange-600' : 
                                                        item.type === 'hotel' ? 'bg-indigo-100 text-indigo-600' : 
                                                        item.type === 'flight' ? 'bg-blue-100 text-blue-600' : 
                                                        'bg-emerald-100 text-emerald-600'}`}
                                                >
                                                    <Icon className="w-6 h-6" />
                                                </div>
                                            </div>

                                            {/* Right: Card */}
                                            <div 
                                                onClick={() => setSelectedItem(item)}
                                                className="flex-1 bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:scale-98 transition-transform cursor-pointer group"
                                            >
                                                <div className="flex justify-between items-start">
                                                    <h3 className="font-bold text-gray-800">{item.title}</h3>
                                                    <a 
                                                        href={`https://maps.google.com/maps?q=${encodeURIComponent(item.location)}`}
                                                        onClick={(e) => e.stopPropagation()}
                                                        target="_blank"
                                                        rel="noreferrer"
                                                        className="text-gray-400 hover:text-emerald-600 p-1"
                                                    >
                                                        <MapIcon className="w-4 h-4" />
                                                    </a>
                                                </div>
                                                <p className="text-sm text-emerald-700 font-medium mb-1 flex items-center gap-1">
                                                    <MapPin className="w-3 h-3" /> {item.location}
                                                </p>
                                                <p className="text-sm text-gray-500 line-clamp-2">{item.description}</p>
                                                
                                                <div className="flex gap-2 mt-2">
                                                    {item.details?.dietary && (
                                                        <span className="flex items-center gap-1 text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full">
                                                            <Leaf className="w-3 h-3" /> 素食友善
                                                        </span>
                                                    )}
                                                    {item.details?.credit && (
                                                        <span className="flex items-center gap-1 text-[10px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full">
                                                            <DollarSign className="w-3 h-3" /> MOP 800額度
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {view === 'amap' && <AmapLeafletTab points={allMapPoints} />}
                        {view === 'googleMap' && <GoogleMapTab points={allMapPoints} />}

                        {view === 'gallery' && <GalleryView itineraryData={itineraryData} />}
                        
                        {view === 'foodGuide' && <FoodGuideView />}

                        {view === 'souvenirs' && <SouvenirView />}
                    </div>

                    {/* --- Bottom Navigation --- */}
                    <div className="bg-white border-t border-gray-200 p-2 pb-6 flex justify-around items-center shrink-0 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {[1, 2, 3].map(day => (
                            <button
                                key={day}
                                onClick={() => { setCurrentDay(day); setView('timeline'); }}
                                className={`flex flex-col items-center p-2 rounded-xl transition-all w-12
                                    ${currentDay === day && view === 'timeline' 
                                        ? 'bg-emerald-100 text-emerald-700 scale-105' 
                                        : 'text-gray-400 hover:bg-gray-50'}`}
                            >
                                <Calendar className="w-5 h-5 mb-1" />
                                <span className="text-[10px] font-medium">Day {day}</span>
                            </button>
                        ))}
                        <div className="w-px h-8 bg-gray-200 mx-1" />
                        <button
                            onClick={() => setView('gallery')}
                            className={`flex flex-col items-center p-2 rounded-xl transition-all w-12
                                ${view === 'gallery' 
                                    ? 'bg-pink-100 text-pink-700 scale-105' 
                                    : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            <ImageIcon className="w-5 h-5 mb-1" />
                            <span className="text-[10px] font-medium">插圖</span>
                        </button>
                        <button
                            onClick={() => setView('foodGuide')}
                            className={`flex flex-col items-center p-2 rounded-xl transition-all w-12
                                ${view === 'foodGuide' 
                                    ? 'bg-amber-100 text-amber-700 scale-105' 
                                    : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            <Utensils className="w-5 h-5 mb-1" />
                            <span className="text-[10px] font-medium">餐點</span>
                        </button>
                        <button
                            onClick={() => setView('souvenirs')}
                            className={`flex flex-col items-center p-2 rounded-xl transition-all w-12
                                ${view === 'souvenirs' 
                                    ? 'bg-orange-100 text-orange-700 scale-105' 
                                    : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            <Gift className="w-5 h-5 mb-1" />
                            <span className="text-[10px] font-medium">伴手禮</span>
                        </button>
                        <button
                            onClick={() => setView('amap')}
                            className={`flex flex-col items-center p-2 rounded-xl transition-all w-12
                                ${view === 'amap' 
                                    ? 'bg-emerald-100 text-emerald-700 scale-105' 
                                    : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            <MapIcon className="w-5 h-5 mb-1" />
                            <span className="text-[10px] font-medium">高德</span>
                        </button>
                        <button
                            onClick={() => setView('googleMap')}
                            className={`flex flex-col items-center p-2 rounded-xl transition-all w-12
                                ${view === 'googleMap' 
                                    ? 'bg-blue-100 text-blue-700 scale-105' 
                                    : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            <Globe className="w-5 h-5 mb-1" />
                            <span className="text-[10px] font-medium">Google</span>
                        </button>
                    </div>

                    {/* --- Detail Modal --- */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className="bg-emerald-600 p-4 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-lg">{selectedItem.title}</h3>
                                    <button onClick={() => setSelectedItem(null)}><X className="w-6 h-6" /></button>
                                </div>
                                <div className="p-6">
                                    <div className="flex items-center gap-2 mb-4 text-emerald-700 font-medium">
                                        <MapPin className="w-4 h-4" /> {selectedItem.location}
                                    </div>
                                    <p className="text-gray-600 mb-6 leading-relaxed">{selectedItem.description}</p>
                                    
                                    <div className="bg-gray-50 rounded-xl p-4 border border-gray-100 space-y-3">
                                        <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">詳細資訊</h4>
                                        {selectedItem.details && Object.entries(selectedItem.details).map(([key, value]) => (
                                            <div key={key} className="flex justify-between text-sm border-b border-gray-100 last:border-0 pb-2 last:pb-0">
                                                <span className="text-gray-500 capitalize">{key.replace(/([A-Z])/g, ' $1')}</span>
                                                <span className="font-semibold text-gray-800 text-right max-w-[60%] leading-tight">
                                                    {Array.isArray(value) ? value.join(', ') : value}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <a 
                                        href={`https://maps.google.com/maps?q=${encodeURIComponent(selectedItem.location)}`}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="mt-6 w-full bg-emerald-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-emerald-700 transition"
                                    >
                                        <Navigation className="w-5 h-5" /> 開啟 Google Maps 導航
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- Travel Tips Modal --- */}
                    {showTips && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="font-bold text-xl text-emerald-800">台灣人遊澳門小貼士</h3>
                                    <button onClick={() => setShowTips(false)} className="bg-gray-100 rounded-full p-1"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex gap-3">
                                        <div className="bg-blue-50 p-2 rounded-lg h-fit"><Smartphone className="w-5 h-5 text-blue-600"/></div>
                                        <div>
                                            <h4 className="font-bold text-sm">簽證與證件</h4>
                                            <p className="text-xs text-gray-600">持台灣護照免簽 (30天)，但建議攜帶台胞證以備不時之需 (如進出珠海)。</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="bg-yellow-50 p-2 rounded-lg h-fit"><span className="font-bold text-yellow-600">$</span></div>
                                        <div>
                                            <h4 className="font-bold text-sm">貨幣</h4>
                                            <p className="text-xs text-gray-600">主要使用澳門幣 (MOP)。港幣 (HKD) 通用 (1:1)，但不補水。建議在台灣換港幣，或到澳門用台幣換澳門幣。</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="bg-purple-50 p-2 rounded-lg h-fit"><span className="font-bold text-purple-600">⚡</span></div>
                                        <div>
                                            <h4 className="font-bold text-sm">電壓與插座</h4>
                                            <p className="text-xs text-gray-600">220V，插座為英式三腳方型 (G型)。需攜帶轉接頭。</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="bg-green-50 p-2 rounded-lg h-fit"><Navigation className="w-5 h-5 text-green-600"/></div>
                                        <div>
                                            <h4 className="font-bold text-sm">交通 App</h4>
                                            <p className="text-xs text-gray-600">下載「澳門電召」或「巴士報站」。計程車需付現金或 MPay (部分收支付寶)。</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<MacauTripApp />);
    </script>
</body>
</html>
